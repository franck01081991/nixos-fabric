name: Test NixOS Configurations

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight

jobs:
  test:
    name: Test Configurations
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: |
          experimental-features = nix-command flakes
          substituters = https://cache.nixos.org https://cachix.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cachix.org-1:3JSE1kY+J4t2T9K39c4cHQYWU96t8JX3lN5kXxp+20U=

    - name: Test networking configuration
      run: |
        nix eval .#nixosConfigurations.vm-sapinet.config.networking.hostName
        nix eval .#nixosConfigurations.rtr-noisy.config.networking.hostName

    - name: Test bootloader configuration
      run: |
        nix eval .#nixosConfigurations.vm-sapinet.config.boot.loader.grub.enable
        nix eval .#nixosConfigurations.rtr-noisy.config.boot.loader.grub.enable

    - name: Test networking configuration
      run: |
        nix eval .#nixosConfigurations.vm-sapinet.config.networking.interfaces
        nix eval .#nixosConfigurations.rtr-noisy.config.networking.interfaces

    - name: Test users configuration
      run: |
        nix eval .#nixosConfigurations.vm-sapinet.config.users.users.franck.isNormalUser
        nix eval .#nixosConfigurations.rtr-noisy.config.users.users.franck.isNormalUser

    - name: Test system packages
      run: |
        nix eval .#nixosConfigurations.vm-sapinet.config.environment.systemPackages
        nix eval .#nixosConfigurations.rtr-noisy.config.environment.systemPackages

