name: Test NixOS Configurations

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight

jobs:
  test:
    name: Test Configurations
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        installer-url: https://github.com/DeterminateSystems/nix-installer/releases/latest/download/nix-installer-x86_64-linux
        extra-conf: |
          experimental-features = nix-command flakes
          substituters = https://cache.nixos.org https://cachix.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cachix.org-1:3JSE1kY+J4t2T9K39c4cHQYWU96t8JX3lN5kXxp+20U=

    - name: Test WireGuard configuration
      run: |
        nix eval .#nixosConfigurations.vm-sapinet.config.network-fabric.wireguard
        nix eval .#nixosConfigurations.rtr-noisy.config.network-fabric.wireguard

    - name: Test FRR configuration
      run: |
        nix eval .#nixosConfigurations.vm-sapinet.config.network-fabric.frr
        nix eval .#nixosConfigurations.rtr-noisy.config.network-fabric.frr

    - name: Test networking configuration
      run: |
        nix eval .#nixosConfigurations.vm-sapinet.config.networking.interfaces
        nix eval .#nixosConfigurations.rtr-noisy.config.networking.interfaces

    - name: Test SSH configuration
      run: |
        nix eval .#nixosConfigurations.vm-sapinet.config.services.openssh
        nix eval .#nixosConfigurations.rtr-noisy.config.services.openssh

    - name: Test firewall configuration
      run: |
        nix eval .#nixosConfigurations.vm-sapinet.config.networking.firewall
        nix eval .#nixosConfigurations.rtr-noisy.config.networking.firewall

    - name: Check for undefined variables
      run: |
        nix-instantiate --eval -E 'with import <nixpkgs> {}; builtins.trace (builtins.attrNames (import ./flake.nix).nixosConfigurations) "Configurations available"'