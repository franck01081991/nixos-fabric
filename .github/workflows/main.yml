name: NixOS Fabric CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: |
          experimental-features = nix-command flakes
          substituters = https://cache.nixos.org https://cachix.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cachix.org-1:3JSE1kY+J4t2T9K39c4cHQYWU96t8JX3lN5kXxp+20U=

    - name: Validate flake
      run: nix flake check

    - name: Show available configurations
      run: nix flake show

    - name: Validate rtr-sapinet
      run: nix eval .#nixosConfigurations.rtr-sapinet.config.networking.hostName

    - name: Validate rtr-noisy
      run: nix eval .#nixosConfigurations.rtr-noisy.config.networking.hostName

  build:
    name: Build Configurations
    runs-on: ubuntu-latest
    needs: validate

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: |
          experimental-features = nix-command flakes
          substituters = https://cache.nixos.org https://cachix.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cachix.org-1:3JSE1kY+J4t2T9K39c4cHQYWU96t8JX3lN5kXxp+20U=

    - name: Build rtr-sapinet
      run: |
        nix build .#nixosConfigurations.rtr-sapinet.config.system.build.toplevel --no-link
        echo "rtr-sapinet build succeeded"

    - name: Build rtr-noisy
      run: |
        nix build .#nixosConfigurations.rtr-noisy.config.system.build.toplevel --no-link
        echo "rtr-noisy build succeeded"

    - name: List results (optional)
      run: ls -lah result* || echo "No result link created (expected with --no-link)"

    - name: Verify success
      run: echo "✅ All builds completed successfully"

  test:
    name: Test Configurations
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: |
          experimental-features = nix-command flakes
          substituters = https://cache.nixos.org https://cachix.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cachix.org-1:3JSE1kY+J4t2T9K39c4cHQYWU96t8JX3lN5kXxp+20U=

    - name: Test networking
      run: |
        nix eval .#nixosConfigurations.rtr-sapinet.config.networking.hostName
        nix eval .#nixosConfigurations.rtr-noisy.config.networking.hostName

    - name: Test bootloader
      run: |
        nix eval .#nixosConfigurations.rtr-sapinet.config.boot.loader.grub.enable
        nix eval .#nixosConfigurations.rtr-noisy.config.boot.loader.grub.enable

    - name: Test users
      run: |
        nix eval .#nixosConfigurations.rtr-sapinet.config.users.users.franck.isNormalUser
        nix eval .#nixosConfigurations.rtr-noisy.config.users.users.franck.isNormalUser

    - name: Test packages
      run: |
        nix eval .#nixosConfigurations.rtr-sapinet.config.environment.systemPackages
        nix eval .#nixosConfigurations.rtr-noisy.config.environment.systemPackages

  deploy:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: |
          experimental-features = nix-command flakes
          substituters = https://cache.nixos.org https://cachix.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cachix.org-1:3JSE1kY+J4t2T9K39c4cHQYWU96t8JX3lN5kXxp+20U=

    - name: Build for deployment
      run: |
        nix build .#nixosConfigurations.rtr-sapinet.config.system.build.toplevel
        nix build .#nixosConfigurations.rtr-noisy.config.system.build.toplevel

    - name: Prepare artifacts
      run: |
        mkdir -p deploy
        cp -r result* deploy/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nixos-configurations
        path: deploy/

    - name: Notify success
      run: echo "🎉 Deployment artifacts ready"
