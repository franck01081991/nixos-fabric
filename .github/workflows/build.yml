name: Build NixOS Configurations

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_run:
    workflows: ["Validate NixOS Configurations"]
    branches: [ master ]
    types:
      - completed

jobs:
  build:
    name: Build Configurations
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        installer-url: https://github.com/DeterminateSystems/nix-installer/releases/latest/download/nix-installer-x86_64-linux
        extra-conf: |
          experimental-features = nix-command flakes
          substituters = https://cache.nixos.org https://cachix.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cachix.org-1:3JSE1kY+J4t2T9K39c4cHQYWU96t8JX3lN5kXxp+20U=

    - name: Build vm-sapinet configuration
      run: |
        nix build .#nixosConfigurations.vm-sapinet.config.system.build.toplevel --no-link
        echo "vm-sapinet build succeeded"

    - name: Build rtr-noisy configuration
      run: |
        nix build .#nixosConfigurations.rtr-noisy.config.system.build.toplevel --no-link
        echo "rtr-noisy build succeeded"

    - name: Cache build results
      uses: actions/cache@v3
      with:
        path: /nix/store
        key: ${{ runner.os }}-nix-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-keys: |
          ${{ runner.os }}-nix-

    - name: List build results
      run: ls -lah result* || echo "No result link created (expected with --no-link)"

    - name: Verify build success
      run: echo "✅ All builds completed successfully"