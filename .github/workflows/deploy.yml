name: Deploy NixOS Configurations

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target host to deploy'
        required: true
        default: 'vm-sapinet'
        type: choice
        options:
        - vm-sapinet
        - rtr-noisy
        - all
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging
        - development

jobs:
  deploy:
    name: Deploy to ${{ inputs.target }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: |
          experimental-features = nix-command flakes
          substituters = https://cache.nixos.org https://cachix.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cachix.org-1:3JSE1kY+J4t2T9K39c4cHQYWU96t8JX3lN5kXxp+20U=

    - name: Set up Cachix
      uses: cachix/cachix-action@v12
      with:
        name: nixos-fabric
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

    - name: Build configuration
      id: build
      run: |
        if [ "${{ inputs.target }}" = "all" ]; then
          nix build .#nixosConfigurations.vm-sapinet.config.system.build.toplevel --no-link
          nix build .#nixosConfigurations.rtr-noisy.config.system.build.toplevel --no-link
          echo "targets=vm-sapinet,rtr-noisy" >> $GITHUB_OUTPUT
        else
          nix build .#nixosConfigurations.${{ inputs.target }}.config.system.build.toplevel --no-link
          echo "targets=${{ inputs.target }}" >> $GITHUB_OUTPUT
        fi

    - name: Prepare deployment
      run: |
        echo "Preparing deployment for ${{ steps.build.outputs.targets }} in ${{ inputs.environment }} environment"
        mkdir -p deploy
        cp -r result* deploy/

    - name: Upload deployment artifact
      uses: actions/upload-artifact@v3
      with:
        name: nixos-config-${{ inputs.target }}-${{ inputs.environment }}
        path: deploy/

    - name: Notify deployment
      if: always()
      run: |
        echo "Deployment notification would be sent here"
        echo "Target: ${{ inputs.target }}"
        echo "Environment: ${{ inputs.environment }}"
        echo "Status: ${{ job.status }}"

    - name: Cleanup
      if: always()
      run: rm -rf deploy/