# NixOS Fabric CI/CD Pipeline
#
# This pipeline validates, builds, tests, and prepares for deployment
# the NixOS Fabric configurations with a focus on security and network

name: NixOS Fabric CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Environment variables for the pipeline
env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    substituters = https://cache.nixos.org https://cachix.org
    trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cachix.org-1:3JSE1kY+J4t2T9K39c4cHQYWU96t8JX3lN5kXxp+20U=

jobs:
  # JOB 6: Build Configurations
  # ============================================
  build-configurations:
    name: Build Configurations
    runs-on: ubuntu-latest
    needs: test-integration

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: ${{ env.NIX_CONFIG }}
=======
  # ============================================
  # JOB 6: Build Configurations
  # ============================================
  build-configurations:
    name: Build Configurations
    runs-on: ubuntu-latest
    needs: test-integration

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: ${{ env.NIX_CONFIG }}

    - name: Set CI environment variable
      run: echo "CI=1" >> $GITHUB_ENV============================================
  # JOB 1: Repository Structure Validation
  # ============================================
  validate-structure:
    name: Validate Repository Structure
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: ${{ env.NIX_CONFIG }}

    - name: Check basic structure
      run: |
        echo "📁 Checking basic structure..."
        test -f modules/network-fabric.nix && echo "✅ network-fabric.nix exists"
        test -f modules/frr.nix && echo "✅ frr.nix exists"
        test -f modules/wireguard.nix && echo "✅ wireguard.nix exists"
        test -f modules/network-security.nix && echo "✅ network-security.nix exists"

    - name: Validate flake (evaluation only)
      run: |
        echo "🧬 flake show"
        nix flake show
        echo "🧪 eval toplevel drvPath (no build)"
        nix eval .#nixosConfigurations.test-ci.config.system.build.toplevel.drvPath

  # ============================================
  # JOB 2: Configuration Validation
  # ============================================
  validate-configurations:
    name: Validate Configurations
    runs-on: ubuntu-latest
    needs: validate-structure

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: ${{ env.NIX_CONFIG }}

    - name: Validate basic configurations
      run: |
        echo "🔧 Validating basic configurations..."
        nix eval .#nixosConfigurations.rtr-sapinet.config.networking.hostName
        nix eval .#nixosConfigurations.rtr-noisy.config.networking.hostName

  # ============================================
  # JOB 3: Security Testing
  # ============================================
  test-security:
    name: Test Security Features
    runs-on: ubuntu-latest
    needs: validate-configurations

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: ${{ env.NIX_CONFIG }}

    - name: Test security configurations
      run: |
        echo "🔒 Testing security configurations..."
        nix eval .#nixosConfigurations.rtr-sapinet.config.network-fabric.security.enable
        nix eval .#nixosConfigurations.rtr-sapinet.config.services.openssh.settings.Port

  # ============================================
  # JOB 4: Network Testing
  # ============================================
  test-network:
    name: Test Network Features
    runs-on: ubuntu-latest
    needs: validate-configurations

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: ${{ env.NIX_CONFIG }}

    - name: Test FRR configurations
      run: |
        echo "🌐 Testing FRR configurations..."
        nix eval .#nixosConfigurations.rtr-sapinet.config.network-fabric.frr.enable

    - name: Test WireGuard configurations
      run: |
        echo "🔐 Testing WireGuard configurations..."
        nix eval .#nixosConfigurations.rtr-sapinet.config.network-fabric.wireguard.enable

  # ============================================
  # JOB 5: Integration Testing
  # ============================================
  test-integration:
    name: Test Module Integration
    runs-on: ubuntu-latest
    needs: [test-security, test-network]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: ${{ env.NIX_CONFIG }}

    - name: Test security and networking integration
      run: |
        echo "🧪 Testing security + networking integration..."
        nix eval .#nixosConfigurations.rtr-sapinet.config.networking.firewall.allowedTCPPorts

  # ============================================
  # JOB 6: Build Configurations
  # ============================================
  build-configurations:
    name: Build Configurations
    runs-on: ubuntu-latest
    needs: test-integration

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: ${{ env.NIX_CONFIG }}

    - name: Build configurations
      run: |
        echo "🏗️ Building configurations..."
        nix build .#nixosConfigurations.test-ci.config.system.build.toplevel --no-link
        echo "✅ All builds completed successfully"

  # ============================================
  # JOB 7: Deployment Preparation
  # ============================================
  prepare-deployment:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    needs: build-configurations
    # Only run on master branch
    if: github.ref == 'refs/heads/master'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: ${{ env.NIX_CONFIG }}

    - name: Prepare deployment artifacts
      run: |
        echo "📦 Preparing deployment artifacts..."
        mkdir -p deploy/artifacts
        echo "🎉 Deployment artifacts ready"

    - name: Create deployment summary
      run: |
        echo "📋 Deployment Summary:" > deploy/SUMMARY.txt
        echo "  • rtr-sapinet configuration" >> deploy/SUMMARY.txt
        echo "  • rtr-noisy configuration" >> deploy/SUMMARY.txt
        echo "  • Security module enabled" >> deploy/SUMMARY.txt
        echo "  • All tests passed" >> deploy/SUMMARY.txt
        cat deploy/SUMMARY.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nixos-fabric-configurations
        path: deploy/

# Pipeline Features:
# • Comprehensive validation of repository structure
# • Security module testing
# • Network module testing (FRR, WireGuard)
# • Integration testing between modules
# • Configuration building
# • Deployment artifact preparation
# • Clear job dependencies and flow

# Success Criteria:
# ✅ All jobs complete successfully
# ✅ No syntax errors in any configuration
# ✅ Security module works correctly
# ✅ Network modules work correctly
# ✅ Integration between modules verified
# ✅ Configurations can be built
# ✅ Deployment artifacts are ready

# The pipeline ensures that the NixOS Fabric repository
# maintains high quality, security, and organization standards