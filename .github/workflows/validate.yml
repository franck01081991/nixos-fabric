name: Validate NixOS Configurations

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate:
    name: Validate Configurations
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Nix
      uses: cachix/install-nix-action@v22
      with:
        nix_path: nixpkgs=channel:nixos-23.11
        nix_version: 2.18.1

    - name: Set up Cachix (optional)
      uses: cachix/cachix-action@v12
      with:
        name: nixos-fabric
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      continue-on-error: true

    - name: Validate Nix flake
      run: nix flake check

    - name: Show available configurations
      run: nix flake show

    - name: Validate vm-sapinet configuration
      run: nix eval .#nixosConfigurations.vm-sapinet.config.networking.hostName

    - name: Validate rtr-noisy configuration
      run: nix eval .#nixosConfigurations.rtr-noisy.config.networking.hostName

    - name: Check for syntax errors
      run: |
        find modules/ -name "*.nix" -exec nix-instantiate --parse --expr 'builtins.getFlake "path:$(pwd)?dir={}"' \; || true
        find hosts/ -name "*.nix" -exec nix-instantiate --parse {} \; || true