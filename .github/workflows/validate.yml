name: Validate NixOS Configurations

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate:
    name: Validate Configurations
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        installer-url: https://github.com/DeterminateSystems/nix-installer/releases/latest/download/nix-installer-x86_64-linux
        extra-conf: |
          experimental-features = nix-command flakes
          substituters = https://cache.nixos.org https://cachix.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cachix.org-1:3JSE1kY+J4t2T9K39c4cHQYWU96t8JX3lN5kXxp+20U=

    - name: Validate Nix flake
      run: nix flake check

    - name: Show available configurations
      run: nix flake show

    - name: Validate vm-sapinet configuration
      run: nix eval .#nixosConfigurations.vm-sapinet.config.networking.hostName

    - name: Validate rtr-noisy configuration
      run: nix eval .#nixosConfigurations.rtr-noisy.config.networking.hostName

    - name: Check for syntax errors
      run: |
        find modules/ -name "*.nix" -exec nix-instantiate --parse --expr 'builtins.getFlake "path:$(pwd)?dir={}"' \; || true
        find hosts/ -name "*.nix" -exec nix-instantiate --parse {} \; || true