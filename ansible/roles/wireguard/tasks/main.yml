# WireGuard configuration for NixOS fabric
---
- name: Generate WireGuard private key
  ansible.builtin.command: wg genkey
  register: wireguard_private_key
  changed_when: false
  when: wg_private_key_file is not defined or not wg_private_key_file.stat.exists

- name: Save WireGuard private key
  ansible.builtin.copy:
    dest: "/etc/wireguard/{{ inventory_hostname }}.key"
    content: "{{ wg_private_key.stdout }}"
    mode: '0600'
  when: wg_private_key is defined and wg_private_key.stdout

- name: Generate WireGuard public key
  ansible.builtin.command: "echo {{ wireguard_private_key.stdout }} | wg pubkey"
  register: wireguard_public_key
  changed_when: false
  when: wireguard_private_key is defined and wireguard_private_key.stdout

- name: Set WireGuard variables
  ansible.builtin.set_fact:
    wireguard_ip_address: "10.255.0.{{ '1' if inventory_hostname == 'rtr-sapinet' else '11' }}/24"
    wireguard_port: 51820
    wireguard_mtu: 1420
    wireguard_peers:
      - public_key: "{{ hostvars['rtr-noisy'].wireguard_public_key if inventory_hostname == 'rtr-sapinet' else hostvars['rtr-sapinet'].wireguard_public_key }}"
        allowed_ips:
          - "10.255.0.{{ '11' if inventory_hostname == 'rtr-sapinet' else '1' }}/32"
          - "10.254.0.{{ '11' if inventory_hostname == 'rtr-sapinet' else '1' }}/32"
        endpoint: "45.90.162.251:{{ wireguard_port }}"
        persistent_keepalive: 25
    wireguard_peers_list:
      - name: "rtr-noisy"
        public_key: "{{ hostvars['rtr-noisy'].wireguard_public_key }}"
        allowed_ips: ["10.255.0.11/32", "10.254.0.11/32"]
        endpoint: "45.90.162.251"
      - name: "rtr-sapinet"
        public_key: "{{ hostvars['rtr-sapinet'].wireguard_public_key }}"
        allowed_ips: ["10.255.0.1/32", "10.254.0.1/32"]
        endpoint: "45.90.162.250"

- name: Create WireGuard secrets file
  ansible.builtin.template:
    src: wireguard-secrets.j2
    dest: /etc/nixos/secrets/wireguard.nix
    mode: '0600'

- name: Configure WireGuard interface
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wgtransport.conf
    mode: '0600'

- name: Enable WireGuard service
  ansible.builtin.systemd:
    name: wg-quick@wgtransport
    enabled: true
    state: started
