# Ansible Playbook: Verify NixOS Fabric
# Verification playbook for NixOS Fabric deployment

---
- name: Verify NixOS Fabric Deployment
  hosts: all
  become: true
  
  tasks:
    - name: Check FRR service status
      service:
        name: frr
        state: started
        enabled: yes
      when: frr_enabled | default(true)
      
    - name: Check WireGuard interface
      command: ip link show wgtransport
      register: wg_interface
      changed_when: false
      when: wireguard_enabled | default(true)
      
    - name: Check firewall rules
      command: nft list ruleset
      register: firewall_rules
      changed_when: false
      when: security_enabled | default(true)
      
    - name: Check SSH configuration
      command: sshd -T
      register: ssh_config
      changed_when: false
      when: security_enabled | default(true)