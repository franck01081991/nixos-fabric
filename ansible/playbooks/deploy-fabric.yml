# Ansible Playbook: Deploy NixOS Fabric
# Main deployment playbook for NixOS Fabric infrastructure

---
- name: Deploy NixOS Fabric Infrastructure
  hosts: all
  become: true
  
  roles:
    - common
    - frr
    - wireguard
    - security
  
  tasks:
    - name: Verify fabric deployment
      include_role:
        name: verify-fabric
      when: verify_deployment | default(true)